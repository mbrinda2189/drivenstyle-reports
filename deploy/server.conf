# server.conf - The settings of the tool on the client's server (v0.29.0)
# =======================================================================
#
# WHAT THIS FILE IS
# -----------------
# The few things that are particular to the client's server. install.sh
# reads this file every time the tool is sent to the server, so a change
# here takes effect at the next  deploy\deploy.ps1.
#
# Nothing here is a secret: the Google client ID is public by design (it
# is sent to every browser). The key that signs the sign-in cookie is NOT
# here - the server creates it itself and keeps it in its data folder.
#
# Plain  NAME=value  lines, no spaces around "=".

# The web address staff type. Must point to the server (DuckDNS / DNS).
DOMAIN=drivenstyle.duckdns.org

# The port the tool listens on INSIDE the server only. nginx passes the web
# address to it. Change only if another program on the server takes 8010.
PORT=8010

# Google sign-in: the "Web application" client ID (Google Cloud, project of
# automation.drivenstyle@gmail.com).
GOOGLE_CLIENT_ID=734657883157-qv01qmm75ostojrifc7e8dg0n7ei2k93.apps.googleusercontent.com

# Made admin when the users list has no active admin (comma separated).
ADMINS=automation.drivenstyle@gmail.com

# Where Let's Encrypt writes when the HTTPS certificate is about to expire.
CERT_EMAIL=automation.drivenstyle@gmail.com

# How many nightly backups of the database are kept on the server.
BACKUP_DAYS=14
