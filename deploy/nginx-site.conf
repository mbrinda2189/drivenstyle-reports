# nginx-site.conf - The tool's own site in nginx (v0.29.0)
# ========================================================
#
# WHAT THIS FILE IS
# -----------------
# nginx is the web server that already runs on the client's server for
# their other sites. This is ONE more site beside them: whatever arrives
# for the tool's web address is passed to the tool, which listens inside
# the server only. No other site's file is touched.
#
# install.sh copies this to /etc/nginx/sites-available/<address>, with the
# two words in double underscores replaced from deploy/server.conf. certbot
# then adds the HTTPS lines to that copy by itself (as it did for the
# server's other sites) - which is why there is no "443" here.

server {
    listen 80;
    server_name __DOMAIN__;

    # Zoho exports and invoice PDFs are uploaded: allow up to 50 MB.
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Generating the monthly workbook and its PDF can take a while.
        proxy_read_timeout 300s;
    }
}
